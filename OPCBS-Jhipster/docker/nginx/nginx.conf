user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  10240;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=payment_callback_limit:10m rate=10r/s;

    # Docker Internal DNS Resolver (enables dynamic IP resolution in Docker bridge network)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # =========================================================================
    # BFF GATEWAY: CHUYỂN ĐỔI HTTPONLY COOKIE THÀNH AUTHORIZATION: BEARER
    # =========================================================================
    # Tự động trích xuất token từ HttpOnly Cookie ('jhi-authenticationToken' hoặc 'id_token')
    # Nginx chuẩn hóa tên cookie thành chữ thường: 'jhi-authenticationToken' -> $cookie_jhi_authenticationtoken
    map $cookie_jhi_authenticationtoken $token_from_jhi {
        default $cookie_jhi_authenticationtoken;
        ""      $cookie_jhi_authenticationToken;
    }

    map $token_from_jhi $token_from_cookie {
        default $token_from_jhi;
        ""      $cookie_id_token;
    }

    map $token_from_cookie $bearer_from_cookie {
        default "Bearer $token_from_cookie";
        ""      "";
    }

    map $http_authorization $final_authorization {
        default $http_authorization;
        ""      $bearer_from_cookie;
    }

    # WebSocket Connection Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # =========================================================================
    # UPSTREAM CLUSTER (8 MICROSERVICES + FRONTEND SPA)
    # =========================================================================
    upstream auth_backend {
        least_conn;
        server opcbs-auth-service:8081 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream booking_backend {
        least_conn;
        server opcbs-booking-service:8082 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream clinical_backend {
        least_conn;
        server opcbs-clinical-service:8083 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream treatment_backend {
        least_conn;
        server opcbs-treatment-service:8084 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream psychometric_backend {
        least_conn;
        server opcbs-psychometric-service:8085 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream notification_backend {
        least_conn;
        server opcbs-notification-service:8086 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream payment_backend {
        least_conn;
        server opcbs-payment-service:8087 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream message_backend {
        least_conn;
        server opcbs-message-service:8088 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream blog_backend {
        least_conn;
        server opcbs-blog-service:8089 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_spa {
        server opcbs-frontend:80;
        keepalive 64;
    }

    # =========================================================================
    # NGINX REVERSE PROXY & GATEWAY SERVER
    # =========================================================================
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 25M;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;

        # Standard Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # BFF Gateway: Tự động chuyển đổi HttpOnly Cookie thành Authorization: Bearer
        proxy_set_header Authorization $final_authorization;

        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 0. JWKS RFC 7517 Public Key Endpoint (Auth Service Port 8081)
        location ~ ^/(.well-known/jwks.json|api/jwks) {
            proxy_pass http://auth_backend;
        }

        # 1. Auth Service Routes (Port 8081) - Kèm Rate Limiting
        location ~ ^/api/(authenticate|logout|register|register-doctor|account|users|authorities|admin/users) {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://auth_backend;
        }

        # 2. Nested routes cho Treatment & Psychometrics theo Patient ID
        location ~ ^/api/doctor/patients/[0-9]+/shared-journals {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://treatment_backend;
        }
        location ~ ^/api/doctor/patients/[0-9]+/psychometrics {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://psychometric_backend;
        }

        # 3. Clinical Service Routes (Port 8083)
        location ~ ^/api/(patient-profiles|doctor/my-patients|doctor/patients|patient/my-clinical-records) {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://clinical_backend;
        }

        # 4. Treatment Service Routes (Port 8084)
        location ~ ^/api/(doctor/treatment-packages|patient/my-treatment-packages|treatment-packages|patient/journals) {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://treatment_backend;
        }

        # 5. Psychometric Service Routes (Port 8085)
        location ~ ^/api/(psychometrics|patient/psychometrics|doctor/psychometrics|admin/psychometrics) {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://psychometric_backend;
        }

        # 6. Notification Service Routes (Port 8086)
        location ~ ^/api/notifications {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://notification_backend;
        }

        # 7.1 Payment Callback & IPN (Port 8087) - Dedicated Protection & Rate Limit
        location ~ ^/api/payments/(vnpay-callback|vnpay_return|ipn) {
            limit_req zone=payment_callback_limit burst=15 nodelay;
            proxy_pass http://payment_backend;
        }

        # 7. Payment Service General Routes (Port 8087)
        location ~ ^/api/(payments|service-packages|doctor-subscriptions|doctor/subscriptions|doctor/my-subscription|admin/service-packages|admin/dashboard) {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://payment_backend;
        }

        # 8. Message Service Routes (Port 8088)
        location ~ ^/api/conversations {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://message_backend;
        }

        # 8.1 Message Service WebSocket / STOMP Real-Time Chat (Port 8088)
        location /ws {
            proxy_pass http://message_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Authorization $final_authorization;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # 9. Booking Service Routes (Port 8082) - Core Business
        location ~ ^/api/(doctor-profiles|specializations|availability-slots|appointments|doctor/my-slots|doctor/slots|doctor/appointments|doctor/dashboard|doctor/upload-avatar|doctor/upload-certificate|doctor/upload-certificate-cloud|doctor/upload-certificate-base64|doctor/certificates|doctor/verification|doctor/submit-verification|patient/appointments|patient/my-appointments|patient/doctors|admin/doctor-verifications) {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://booking_backend;
        }

        # 10. Blog Service Routes (Port 8089) - Bác sĩ đăng bài, Admin duyệt, Public đọc
        location ~ ^/api/(blogs|doctor/blogs|admin/blogs|patient/blogs) {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://blog_backend;
        }

        # 11. Fallback Management & OpenAPI Docs -> Auth Service (8081)
        location ~ ^/(management|v3/api-docs|services) {
            proxy_pass http://auth_backend;
        }

        # 11. Health Check Endpoint
        location /healthz {
            access_log off;
            return 200 "MindBridge Gateway Healthy\n";
        }

        # 12. Angular 19 SPA Frontend
        location / {
            proxy_pass http://frontend_spa;
        }
    }
}
